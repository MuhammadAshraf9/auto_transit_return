<section class="oe_container">
    <div class="oe_row oe_spaced">

        <style>
            .tabs {
                display: flex;
                gap: 20px;
                margin-bottom: 20px;
                border-bottom: 2px solid #ddd;
            }
            .tabs a {
                padding: 10px 15px;
                text-decoration: none;
                font-weight: bold;
                color: #555;
                border-bottom: 3px solid transparent;
            }
            .tabs a:target,
            .tabs a.active {
                color: #875A7B;
                border-bottom-color: #875A7B;
            }
            .tab-content {

            }
            .tab-content:target {

        <!-- Tabs -->

            <h3>Key Features</h3>
            <ul>
                <li>Automatic return from Transit Location</li>
                <li>Triggered when No Backorder is selected</li>
                <li>Return picking created in Draft state</li>
                <li>Original source location is preserved</li>
                <li>Compatible with Odoo 18</li>
