<section class="oe_container">
    <div class="oe_row oe_spaced">

        <style>
            .odoo-tabs {
                display: flex;
                gap: 20px;
                border-bottom: 2px solid #ddd;
                margin-bottom: 20px;
            }

            .odoo-tabs a {
                text-decoration: none;
                padding: 10px 15px;
                font-weight: 600;
                color: #666;
                border-bottom: 3px solid transparent;
            }

            .odoo-tabs a:hover {
                color: #875A7B;
            }

            .tab-content {
                display: none;
            }

            #features:target,
            #screenshots:target {
                display: block;
            }

            /* Default tab */
            .tab-content.default {
                display: block;
            }
        </style>

        <!-- Tabs Header -->
        <div class="odoo-tabs">
            <a href="#features">Key Features</a>
            <a href="#screenshots">Screenshots</a>
        </div>

        <!-- Key Features -->
        <div id="features" class="tab-content default">
            <h3>Key Features</h3>
            <ul>
                <li>Automatic return from Transit Location</li>
                <li>Triggered when No Backorder is selected</li>
                <li>Return picking created in Draft state</li>
                <li>Original source location is preserved</li>
                <li>Compatible with Odoo 18</li>
            </ul>
        </div>

        <!-- Screenshots -->
        <div id="screenshots" class="tab-content">
            <h3>Screenshots</h3>

            <div class="oe_row oe_spaced">
                <div class="oe_span4">
                    <img src="screenshot_1.png" class="img img-responsive"/>
                </div>
                <div class="oe_span4">
                    <img src="screenshot_2.png" class="img img-responsive"/>
                </div>
                <div class="oe_span4">
                    <img src="screenshot_3.png" class="img img-responsive"/>
                </div>
            </div>

            <div class="oe_row oe_spaced">
                <div class="oe_span4">
                    <img src="screenshot_4.png" class="img img-responsive"/>
                </div>
                <div class="oe_span4">
                    <img src="screenshot_5.png" class="img img-responsive"/>
                </div>
                <div class="oe_span4">
                    <img src="screenshot_6.png" class="img img-responsive"/>
                </div>
            </div>
        </div>

    </div>
</section>
